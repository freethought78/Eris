<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; img-src 'self'">
<title>Eris server</title>
<style>
  :root { --bg: #1a1a2e; --surface: #16213e; --surface-2: #1f2b4d; --text: #e0e0e0; --muted: #9aa3b8;
    --accent: #0f3460; --highlight: #e94560; --good: #4ecca3; --warn: #f0a500; --border: #2a2a4a; --radius: 6px; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 14px system-ui, -apple-system, sans-serif;
    display: flex; flex-direction: column; padding: 16px 20px; gap: 12px; }
  header { display: flex; align-items: center; gap: 14px; }
  header img { width: 56px; height: 56px; }
  h1 { margin: 0; font-size: 20px; }
  .muted { color: var(--muted); }
  .pill { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
  .running .dot { background: var(--good); box-shadow: 0 0 8px var(--good); }
  .starting .dot, .stopping .dot { background: var(--warn); }
  .failed .dot { background: var(--highlight); }
  .grow { flex: 1; }
  button { font: inherit; color: var(--text); background: var(--accent); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 8px 14px; cursor: pointer; }
  button:hover:not(:disabled) { filter: brightness(1.25); }
  button:disabled { opacity: 0.5; cursor: default; }
  button.stop { background: var(--highlight); border-color: var(--highlight); font-weight: 600; }
  .facts { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; background: var(--surface);
    border-radius: var(--radius); padding: 10px 14px; }
  .facts b { font-weight: 600; user-select: text; }
  .error { background: var(--surface-2); border-left: 3px solid var(--highlight); padding: 8px 12px; border-radius: var(--radius); }
  pre { flex: 1; min-height: 0; overflow: auto; margin: 0; background: #10101f; border: 1px solid var(--border);
    border-radius: var(--radius); padding: 10px 12px; font: 12px ui-monospace, monospace; white-space: pre-wrap; user-select: text; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <header>
    <img src="../build/icon.svg" alt="">
    <div class="grow">
      <h1 id="name">Eris server</h1>
      <span id="status" class="pill starting"><span class="dot"></span><span id="statusText">Starting...</span></span>
      <span id="uptime" class="muted"></span>
    </div>
    <button id="start" hidden>Start again</button>
    <button id="restart">Restart</button>
    <button id="stop" class="stop" title="Stops the server and closes this window (closing the window does the same)">Stop server</button>
  </header>
  <div id="error" class="error" hidden></div>
  <div class="facts">
    <span class="muted">Join link</span><b id="link">-</b>
    <span class="muted">Owner code</span><b id="owner">-</b>
    <span class="muted">Version</span><b id="version">-</b>
    <span class="muted">Data</span><b id="data">-</b>
  </div>
  <pre id="log"></pre>
<script src="dashboard-page.js"></script>
</body>
</html>
