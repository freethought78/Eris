<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eris</title>
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <div id="app"></div>
  <script>
    // When opened via file://, load the bundled script (Chrome blocks ES modules on local files)
    if (location.protocol === "file:") {
      document.write('<script src="bundle.js"><\/script>');
    } else {
      document.write('<script type="module" src="app.js"><\/script>');
    }
  </script>
</body>
</html>
